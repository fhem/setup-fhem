name: 'setup-fhem'
description: 'Install fhem, for further steps. Inspired by oher setup actions'
branding:
  icon: package
  color: green
inputs:
  mode:
    description: How to install the package?
    required: false
    default: debian
  runservice:    
    description: Let the default service run or stop it?
    required: false
    default: false
    type: boolean
  
runs:
  using: "composite"
  steps:
    - name: Register debian.fhem repository
      if: inputs.mode == 'debian'
      run: |
        # archive.key is ASCII-armored; apt >= 3 only accepts armored keyrings with the .asc extension
        sudo wget -O /etc/apt/keyrings/deb.fhem.asc https://debian.fhem.de/archive.key
        sudo touch /etc/apt/sources.list.d/deb.fhem.list
        echo 'deb [signed-by=/etc/apt/keyrings/deb.fhem.asc] https://debian.fhem.de/nightly/ /' | sudo tee -a /etc/apt/sources.list.d/deb.fhem.list
      shell: bash

    - name: Install latest deb package
      if: inputs.mode == 'debian'
      run: |
        sudo apt-get update -qq
        sudo apt-get install fhem -y --no-install-recommends
      shell: bash
      
    - name: stop service fhem
      if: inputs.runservice == 'false'
      run: |
        sudo systemctl stop fhem
        # the package may install a SysV init script instead of fhem.service (e.g. on Ubuntu 26.04),
        # then systemctl stop does not end the running process
        if [ -x /etc/init.d/fhem ] && pgrep -u fhem -f fhem.pl > /dev/null; then
          sudo /etc/init.d/fhem stop noaptmark
        fi
      shell: bash
